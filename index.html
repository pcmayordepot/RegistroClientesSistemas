<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del Cliente - PC MAYOR</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .form-container, .success-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; border-top: 8px solid #cc0000; }
        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img { max-width: 200px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #444; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit { background-color: #cc0000; color: white; }
        .btn-submit:hover { background-color: #990000; }
        .btn-whatsapp { background-color: #25D366; color: white; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px; }
        .btn-whatsapp:hover { background-color: #128C7E; }
        .hidden { display: none; }
        .success-container { text-align: center; }
        .success-icon { font-size: 50px; color: #25D366; }
    </style>
</head>
<body>

    <!-- Formulario de Registro -->
    <div id="formCard" class="form-container">
        <div class="logo-container">
            <!-- Aquí puedes colocar la URL de la imagen de tu logo corporativo -->
            <h1 style="color: #cc0000; margin: 0;">PC MAYOR</h1>
            <small style="color: #666;">DEPOT</small>
        </div>
        <h2>Datos del Cliente</h2>
        <form id="clientForm">
            <div class="form-group"><label>Nombre Persona Contacto *</label><input type="text" id="contacto" required></div>
            <div class="form-group"><label>Nombre de la Empresa *</label><input type="text" id="empresa" required></div>
            <div class="form-group"><label>Ubicación *</label><input type="text" id="ubicacion" required></div>
            <div class="form-group">
                <label>Actividad Económica *</label>
                <select id="actividad" required>
                    <option value="">Seleccione...</option>
                    <option value="Ferretería">Ferretería</option>
                    <option value="Restaurante">Restaurante</option>
                    <option value="Supermercado">Supermercado / Mini Market</option>
                    <option value="Otros">Otros</option>
                </select>
            </div>
            <div class="form-group">
                <label>¿Tipo de Contribuyente? *</label>
                <select id="contribuyente" required>
                    <option value="Ordinario">Contribuyente Ordinario</option>
                    <option value="Especial">Contribuyente Especial</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
            <div class="form-group"><label>¿Cuántas estaciones utilizarían el sistema? *</label><input type="text" id="estaciones" required></div>
            <div class="form-group"><label>¿Cuál es su método de facturación? *</label><input type="text" id="facturacion" required></div>
            <div class="form-group"><label>Si selecciona impresora fiscal, indique marca/modelo</label><input type="text" id="detalles"></div>
            
            <button type="submit" class="btn-submit" id="btnEnviarTexto">Enviar Datos</button>
        </form>
    </div>

    <!-- Pantalla Final Exclusiva de Agradecimiento -->
    <div id="successCard" class="success-container hidden">
        <div class="success-icon">✓</div>
        <h2>¡Registro Recibido con Éxito!</h2>
        <p style="color: #555; line-height: 1.5;">Tu requerimiento ha sido guardado en el sistema correctamente.<br><strong>Por favor, haz clic abajo para procesar la información:</strong></p>
        
        <!-- BOTÓN REAL DE WHATSAPP SIN ENLACES LARGOS EN PANTALLA -->
        <a id="whatsappLink" href="#" target="_blank" class="button btn-whatsapp">
            <span>💬 Confirmo enviar datos</span>
        </a>
    </div>

    <script>
        // URL DE TU APLICACIÓN WEB DE GOOGLE SHEETS
        const URL_GOOGLE_SCRIPT = https://script.google.com/macros/s/AKfycbxu8j2Ka1-ME7CudzMSnLk5t-VR678V9A2CtTw4QBimkByyhFBX9oVTLyHpewN0K1lj/exec;

        document.getElementById('clientForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btnTexto = document.getElementById('btnEnviarTexto');
            btnTexto.innerText = "Procesando...";
            btnTexto.disabled = true;

            // 1. Recopilar los valores del formulario
            const payload = {
                contacto: document.getElementById('contacto').value,
                empresa: document.getElementById('empresa').value,
                ubicacion: document.getElementById('ubicacion').value,
                actividad: document.getElementById('actividad').value,
                contribuyente: document.getElementById('contribuyente').value,
                estaciones: document.getElementById('estaciones').value,
                facturacion: document.getElementById('facturacion').value,
                detalles: document.getElementById('detalles').value || "No aplica"
            };

            // 2. Enviar los datos de forma invisible a Google Sheets
            fetch(URL_GOOGLE_SCRIPT, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                // 3. Crear el mensaje limpio estructurado para WhatsApp
                const textoMensaje = `¡Hola! 👋 Acabo de completar el formulario de registro. Aquí están los detalles de mi solicitud:\n\n` +
                                     `👤 Contacto: ${payload.contacto}\n` +
                                     `🏢 Empresa: ${payload.empresa}\n` +
                                     `📍 Ubicación: ${payload.ubicacion}\n` +
                                     `💼 Actividad: ${payload.actividad}\n` +
                                     `⚖️ Contribuyente: ${payload.contribuyente}\n` +
                                     `👥 Estaciones: ${payload.estaciones}\n` +
                                     `🧾 Facturación: ${payload.facturacion}\n` +
                                     `🖨️ Detalles: ${payload.detalles}\n\n` +
                                     `Confirmo enviar datos.`;

                // 4. Asignar el enlace estructurado internamente al botón verde
                const urlWhatsapp = "https://wa.me/584124450795?text=" + encodeURIComponent(textoMensaje);
                document.getElementById('whatsappLink').href = urlWhatsapp;

                // 5. Intercambiar pantallas visualmente
                document.getElementById('formCard').classList.add('hidden');
                document.getElementById('successCard').classList.remove('hidden');
            }).catch(error => {
                alert("Hubo un problema al enviar los datos: " + error);
                btnTexto.innerText = "Enviar Datos";
                btnTexto.disabled = false;
            });
        });
    </script>
</body>
</html>
